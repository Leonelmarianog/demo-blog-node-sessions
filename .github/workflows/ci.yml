name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          APP_PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: demo_blog_test
          DB_TEST_NAME: demo_blog_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SESSION_SECRET: ci-session-secret-please-use-32-or-more-chars
          APP_BASE_URL: http://localhost:3000
          VERIFICATION_TOKEN_TTL_SECONDS: 3600